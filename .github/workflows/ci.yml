name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repository, packages, or pull requests.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parking
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking -d parking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://parking:parking@localhost:5432/parking
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-for-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Same rule as the commit-msg hook, so skipping the hook locally cannot bypass it.
      - name: Commit subjects follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: node scripts/check-commit-range.mjs "origin/${{ github.base_ref }}..HEAD"

      # Lint carries the package-boundary rules (biome.json overrides); typecheck rejects relative
      # imports that leave a package (rootDir in each package's tsconfig).
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

  images:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds only; nothing is pushed. Proves the Dockerfiles stay in step with the workspace.
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t parking-${{ matrix.app }}:ci .
      # Informational scan: the table is in the job log. The threshold that fails the build is a
      # policy decision recorded in docs/05; until then, findings are visible but do not block.
      - name: Scan image (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: parking-${{ matrix.app }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  rehearsal:
    name: Compose rehearsal (api, worker, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the image topology
        run: docker compose -f docker-compose.yml -f docker-compose.images.yml up -d --build --wait --wait-timeout 180
      - name: Migrate as a one-off task
        run: docker compose -f docker-compose.yml -f docker-compose.images.yml run --rm api node dist/migrate.js
      - name: Every service healthy, including the worker
        run: |
          docker compose -f docker-compose.yml -f docker-compose.images.yml ps --format '{{.Service}} {{.Health}}'
          test "$(docker compose -f docker-compose.yml -f docker-compose.images.yml ps --format '{{.Health}}' | grep -vxc healthy)" = "0"
      - name: Health checks fail when the condition they test is absent
        run: |
          set -eux
          # The worker probe (exact healthcheck command) must match the real worker and must not
          # match a container without one; the previous unanchored pattern matched its own shell.
          # Negative checks use if/exit: `set -e` ignores the status of a `!`-negated command.
          probe="pgrep -f '^node dist/scheduler\.js$' > /dev/null || exit 1"
          docker compose -f docker-compose.yml -f docker-compose.images.yml exec -T scheduler sh -c "$probe"
          if docker compose -f docker-compose.yml -f docker-compose.images.yml run --rm --no-deps -T --entrypoint sh api -c "$probe" </dev/null; then
            echo "worker probe matched a container without the worker"; exit 1
          fi
          # The health assertion above must reject an unhealthy service.
          test "$(printf 'healthy\nunhealthy\n' | grep -vxc healthy)" = "1"
      - name: Edge behaves as documented
        run: |
          set -eux
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:8080/api/metrics | grep -x 404
          curl -sSI http://localhost:8080/ | grep -i 'content-security-policy'
          curl -sSI http://localhost:8080/ | grep -i 'x-content-type-options: nosniff'
          if curl -sSI http://localhost:8080/ | grep -i 'server: nginx/'; then
            echo "edge discloses the nginx version"; exit 1
          fi
          docker compose -f docker-compose.yml -f docker-compose.images.yml exec -T web id -u | grep -x 101
          docker compose -f docker-compose.yml -f docker-compose.images.yml exec -T api id -u | grep -x 1000
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.images.yml down -v
