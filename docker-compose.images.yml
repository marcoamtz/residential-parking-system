# Runs the production images against the local PostgreSQL and Redis from docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.images.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.images.yml run --rm api node dist/migrate.js
#   open http://localhost:8080
#
# This is a local rehearsal of the reference topology in docs/01-architecture.md, not a
# production deployment: secrets are placeholders and there is no TLS.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://parking:parking@postgres:5432/parking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-images-only-secret-change-me
      # Production has no password-less login; enabled here so the rehearsal can be exercised.
      MOCK_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as the API, different entrypoint: the quarterly rotation worker (ADR-0012).
  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/scheduler.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://parking:parking@postgres:5432/parking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-images-only-secret-change-me
      ROTATION_CRON: "0 6 * * *"
      DRAW_LEAD_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      - api
